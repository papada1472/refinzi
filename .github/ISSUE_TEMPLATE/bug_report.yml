name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Refinzi
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a bug!
  - type: input
    id: version
    attributes:
      label: Refinzi Version
      placeholder: "e.g. v2.0.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you running Refinzi in?
      options:
        - Google Chrome
        - Microsoft Edge
        - Mozilla Firefox
        - Other (Chromium-based)
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: AI Site
      description: Where did the problem occur?
      options:
        - ChatGPT (chatgpt.com)
        - Claude (claude.ai)
        - Google Gemini (gemini.google.com)
        - Perplexity (perplexity.ai)
        - Other / generic page
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      placeholder: Clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to chatgpt.com
        2. Type a rough prompt in the composer
        3. Click (or press and hold) the Refinzi Orb
        4. See error...
    validations:
      required: true
